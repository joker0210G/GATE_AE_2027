<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GATE Scientific Calculator (Official TCS iON Replica)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc-window">
    <!-- Header Bar -->
    <div class="calc-header">
      <span class="calc-title">Scientific Calculator</span>
      <div class="header-controls">
        <button class="btn-help" onclick="alert('GATE Scientific Calculator Help:\n\n• Post-fix calculation for unary functions (e.g. 30 -> sin = 0.5).\n• Standard PEMDAS/BODMAS for binary operations.\n• Memory Store (MS), Recall (MR), Add (M+), Subtract (M-), Clear (MC).\n• Deg/Rad toggle for trigonometric evaluations.')">Help</button>
        <div class="window-icons">
          <span>_</span>
          <span>✕</span>
        </div>
      </div>
    </div>
    
    <!-- Display Area -->
    <div class="display-container">
      <div id="formula-display" class="formula-box"></div>
      <input type="text" id="main-display" class="main-box" value="0" readonly>
    </div>
    
    <!-- 11-Column Keypad Grid (100% Exact TCS iON Layout) -->
    <div class="keypad-grid">
      <!-- Row 1: Mod, Mode Radios, Memory Keys -->
      <button class="calc-btn" data-action="op" data-val="mod">mod</button>
      <div class="radio-container">
        <label class="radio-label">
          <input type="radio" name="angle-mode" id="mode-deg" value="deg" checked> Deg
        </label>
        <label class="radio-label">
          <input type="radio" name="angle-mode" id="mode-rad" value="rad"> Rad
        </label>
      </div>
      <button class="calc-btn" data-action="mem" data-val="MC">MC</button>
      <button class="calc-btn" data-action="mem" data-val="MR">MR</button>
      <button class="calc-btn" data-action="mem" data-val="MS">MS</button>
      <button class="calc-btn" data-action="mem" data-val="M+">M+</button>
      <button class="calc-btn" data-action="mem" data-val="M-">M-</button>

      <!-- Row 2: Hyperbolic, Exp, Brackets, Red Controls, Square Root -->
      <button class="calc-btn" data-action="unary" data-val="sinh">sinh</button>
      <button class="calc-btn" data-action="unary" data-val="cosh">cosh</button>
      <button class="calc-btn" data-action="unary" data-val="tanh">tanh</button>
      <button class="calc-btn" data-action="op" data-val="exp">Exp</button>
      <button class="calc-btn" data-action="bracket" data-val="(">(</button>
      <button class="calc-btn" data-action="bracket" data-val=")">)</button>
      <button class="calc-btn btn-red span-2-col" data-action="backspace">←</button>
      <button class="calc-btn btn-red" data-action="clear">C</button>
      <button class="calc-btn btn-red" data-action="unary" data-val="plusminus">+/-</button>
      <button class="calc-btn" data-action="unary" data-val="sqrt">√</button>

      <!-- Row 3: Inv Hyperbolic, Logs, Digits 7-9, Divide, Percent -->
      <button class="calc-btn" data-action="unary" data-val="asinh">sinh⁻¹</button>
      <button class="calc-btn" data-action="unary" data-val="acosh">cosh⁻¹</button>
      <button class="calc-btn" data-action="unary" data-val="atanh">tanh⁻¹</button>
      <button class="calc-btn" data-action="unary" data-val="log2">log₂x</button>
      <button class="calc-btn" data-action="unary" data-val="ln">ln</button>
      <button class="calc-btn" data-action="unary" data-val="log10">log</button>
      <button class="calc-btn btn-num" data-action="num" data-val="7">7</button>
      <button class="calc-btn btn-num" data-action="num" data-val="8">8</button>
      <button class="calc-btn btn-num" data-action="num" data-val="9">9</button>
      <button class="calc-btn" data-action="op" data-val="/">/</button>
      <button class="calc-btn" data-action="unary" data-val="percent">%</button>

      <!-- Row 4: Constants, Factorial, Base-y Log, Exponentials, Digits 4-6, Multiply, Reciprocal -->
      <button class="calc-btn" data-action="const" data-val="pi">π</button>
      <button class="calc-btn" data-action="const" data-val="e">e</button>
      <button class="calc-btn" data-action="unary" data-val="fact">n!</button>
      <button class="calc-btn" data-action="op" data-val="log_y">logᵧx</button>
      <button class="calc-btn" data-action="unary" data-val="epow">eˣ</button>
      <button class="calc-btn" data-action="unary" data-val="10pow">10ˣ</button>
      <button class="calc-btn btn-num" data-action="num" data-val="4">4</button>
      <button class="calc-btn btn-num" data-action="num" data-val="5">5</button>
      <button class="calc-btn btn-num" data-action="num" data-val="6">6</button>
      <button class="calc-btn" data-action="op" data-val="*">*</button>
      <button class="calc-btn" data-action="unary" data-val="recip">1/x</button>

      <!-- Row 5: Trig, Powers, Digits 1-3, Subtract, Green Equals (span 2 rows) -->
      <button class="calc-btn" data-action="unary" data-val="sin">sin</button>
      <button class="calc-btn" data-action="unary" data-val="cos">cos</button>
      <button class="calc-btn" data-action="unary" data-val="tan">tan</button>
      <button class="calc-btn" data-action="op" data-val="^">xʸ</button>
      <button class="calc-btn" data-action="unary" data-val="cube">x³</button>
      <button class="calc-btn" data-action="unary" data-val="sqr">x²</button>
      <button class="calc-btn btn-num" data-action="num" data-val="1">1</button>
      <button class="calc-btn btn-num" data-action="num" data-val="2">2</button>
      <button class="calc-btn btn-num" data-action="num" data-val="3">3</button>
      <button class="calc-btn" data-action="op" data-val="-">-</button>
      <button class="calc-btn btn-green" data-action="equal">=</button>

      <!-- Row 6: Inv Trig, Roots, Absolute, Zero (span 2 cols), Decimal, Add -->
      <button class="calc-btn" data-action="unary" data-val="asin">sin⁻¹</button>
      <button class="calc-btn" data-action="unary" data-val="acos">cos⁻¹</button>
      <button class="calc-btn" data-action="unary" data-val="atan">tan⁻¹</button>
      <button class="calc-btn" data-action="op" data-val="root_y">ʸ√x</button>
      <button class="calc-btn" data-action="unary" data-val="cbrt">∛</button>
      <button class="calc-btn" data-action="unary" data-val="abs">|x|</button>
      <button class="calc-btn btn-num span-2-col" data-action="num" data-val="0">0</button>
      <button class="calc-btn btn-num" data-action="dot">.</button>
      <button class="calc-btn" data-action="op" data-val="+">+</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
